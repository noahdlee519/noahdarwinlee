<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>citylayoutguessr — Noah Darwin Lee</title>
    <meta
      name="description"
      content="A guessing game by Noah Darwin Lee: name the city from a satellite image of its layout. One guess per image, three levels, ten rounds each."
    />
    <link rel="canonical" href="https://noahdarwinlee.com/citylayoutguessr/" />
    <link rel="icon" href="../favicon.png" type="image/png" />

    <!-- Added to the home screen the game opens on its own, with no address
         bar and no domain pill above the keyboard. -->
    <link rel="manifest" href="app.webmanifest" />
    <link rel="apple-touch-icon" href="../art/web/citylayoutguessr/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="citylayoutguessr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#e68019" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noah Darwin Lee" />
    <meta property="og:title" content="citylayoutguessr — Noah Darwin Lee" />
    <meta property="og:description" content="Name the city from a satellite image of its layout. One guess per image, three levels, ten rounds each." />
    <meta property="og:url" content="https://noahdarwinlee.com/citylayoutguessr/" />
    <!-- The game's own share card, not the site's: a round of it, with the
         wordmark under the map. Every other page keeps /og.jpg. -->
    <meta
      property="og:image"
      content="https://noahdarwinlee.com/art/web/citylayoutguessr/og.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A satellite view of a coastal city above the citylayoutguessr wordmark"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://noahdarwinlee.com/art/web/citylayoutguessr/og.jpg"
    />

    <link rel="stylesheet" href="../styles.css" />

    <!-- What this page is allowed to load and talk to. A signed-in session is
         kept in this browser, so the thing to prevent is any script that is not
         ours running here: script-src names the only two places code may come
         from, and object/base/form are shut. Everything else on the list is
         what the page genuinely needs — the webfont, the map images, Google's
         profile pictures, and this project's own Supabase. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net;
        style-src 'self' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data: https://*.googleusercontent.com;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
  </head>
  <body class="cv-page game-page" data-fade-distance="45">
    <h1 class="sr-only">citylayoutguessr</h1>
    <a class="name" href="/"
      ><span class="name-word-noah">Noah</span> <span class="name-word-darwin">Darwin</span>
      <span class="name-word-lee">Lee</span></a
    >
    <a class="back-link" href="/materials/">back</a>
    <button class="to-top-btn" id="to-top-btn" aria-label="Back to top">
      <img src="../favicon.png" alt="" width="30" height="30" />
    </button>

    <main class="game">
      <!-- The wordmark, as wide as the game window itself, and the way back to
           the menu from a game in progress. The page already carries a
           screen-reader h1 with the name, so the picture itself is marked
           decorative rather than read out a second time. -->
      <button class="game-logo-btn" type="button" id="game-logo-home">
      <img
        class="game-logo"
        src="../art/web/citylayoutguessr/logo-1240.webp"
        srcset="
          ../art/web/citylayoutguessr/logo-760.webp   760w,
          ../art/web/citylayoutguessr/logo-1240.webp 1240w,
          ../art/web/citylayoutguessr/logo-1860.webp 1860w,
          ../art/web/citylayoutguessr/logo-2480.webp 2480w
        "
        sizes="(min-width: 701px) min(1240px, 92vw), 100vw"
        width="7074"
        height="843"
        alt=""
        fetchpriority="high"
      />
      </button>

      <section class="game-intro" id="game-intro">
        <p class="game-lede">
          To play, guess the city from the satellite image of its urban layout.
          Then, type the city and press enter
        </p>
        <div class="game-daily" id="game-daily" hidden>
          <button class="game-btn game-daily-btn" type="button" id="daily-start">
            today&rsquo;s challenge
          </button>
          <span class="game-daily-note" id="daily-note"></span>
        </div>

        <!-- Sign-in and the board only appear once supabase-config.js has been
             filled in; until then cloud.js leaves them hidden. -->
        <div class="game-account" id="game-account" hidden>
          <button class="game-btn game-signin" type="button" id="game-signin">
            sign in with Google
          </button>
          <span class="game-daily-note game-account-note" id="game-account-note"
            >sign in to compete with others</span
          >
          <span class="game-who" id="game-who" hidden>
            <img class="game-avatar" id="game-avatar" alt="" width="30" height="30" hidden />
            <span class="game-who-name" id="game-who-name"></span>
            <button class="game-quiet" type="button" id="game-rename">change name</button>
            <button class="game-quiet" type="button" id="game-signout">sign out</button>
          </span>

          <!-- The name on the board is whatever Google gave us until you say
               otherwise. -->
          <form class="game-rename-form" id="game-rename-form" hidden>
            <label class="sr-only" for="game-name-input">The name shown on the board</label>
            <input
              class="game-name-input"
              id="game-name-input"
              type="text"
              maxlength="24"
              autocomplete="off"
              autocapitalize="words"
              spellcheck="false"
              placeholder="name on the board"
            />
            <button class="game-btn game-name-save" type="submit">save</button>
            <button class="game-quiet" type="button" id="game-name-cancel">cancel</button>
            <span class="game-name-note" id="game-name-note" hidden aria-live="polite"></span>
          </form>
        </div>

        <span class="game-leaders-slot" id="game-leaders-slot" hidden></span>

        <h2 class="game-custom">
          <button
            class="game-fold"
            type="button"
            id="game-custom-fold"
            aria-expanded="true"
            aria-controls="game-custom-body"
          >
            custom game
          </button>
        </h2>

        <div class="game-custom-body" id="game-custom-body">
        <form class="game-setup" id="game-setup">
          <fieldset class="game-set">
            <legend class="game-set-label">difficulty</legend>
            <div class="game-checks" id="setup-levels"></div>
          </fieldset>

          <fieldset class="game-set">
            <legend class="game-set-label">region</legend>
            <div class="game-checks" id="setup-continents"></div>
          </fieldset>

          <fieldset class="game-set">
            <legend class="game-set-label">rounds</legend>
            <div class="game-slider">
              <input
                class="game-range"
                type="range"
                id="setup-length"
                min="0"
                max="4"
                step="1"
                value="0"
                aria-label="How many rounds"
              />
              <div class="game-ticks" id="setup-ticks" aria-hidden="true"></div>
            </div>
          </fieldset>

          <fieldset class="game-set">
            <legend class="game-set-label">hints</legend>
            <div class="game-checks">
              <label class="game-check">
                <input type="checkbox" id="setup-hints" checked />
                <span class="game-check-mark" aria-hidden="true"></span>
                <span class="game-check-text game-hint-text"
                  >a miss shows the continent, a second shows the country</span
                >
              </label>
            </div>
          </fieldset>

          <p class="game-pool" id="setup-pool"></p>
          <div class="game-start-row">
            <button class="game-btn game-start" type="submit" id="setup-start">start</button>
            <!-- Only there when a custom game was left part-way through. -->
            <button class="game-btn game-start game-continue" type="button" id="setup-continue" hidden>
              continue
            </button>
          </div>
        </form>

        </div>

        <p class="game-empty" id="game-empty" hidden>
          No maps match that combination.
        </p>
      </section>

      <section class="game-board" id="game-board" hidden aria-label="Current round">
        <div class="game-meta">
          <span class="game-progress"
            ><span class="game-progress-where" id="game-progress-where"></span
            ><span class="game-progress-count" id="game-progress-count"></span
          ></span>
          <!-- Touch screens only, and only in the two-row bar a phone gets:
               it sits at the right end of the line the game's name is on. -->
          <span class="game-zoom-hint" aria-hidden="true">tap to zoom</span>
          <span class="game-meta-break" aria-hidden="true"></span>
          <span class="game-meta-right">
            <span class="game-score" id="game-score"></span>
            <button class="game-quit" type="button" id="game-quit">menu</button>
          </span>
        </div>

        <div class="game-frame" id="game-frame"></div>

        <p class="game-ask" id="game-ask" hidden role="status"></p>

        <form class="game-form" id="game-form" autocomplete="off">
          <label class="sr-only" for="game-input">Your guess</label>
          <input
            class="game-input"
            id="game-input"
            type="text"
            name="guess"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
            inputmode="text"
            data-1p-ignore
            data-lpignore="true"
            data-form-type="other"
            placeholder="type a city"
          />
          <button class="game-btn" type="submit" id="game-submit">guess</button>
        </form>

        <div class="game-reveal" id="game-reveal" hidden>
          <p class="game-verdict" id="game-verdict"></p>
          <p class="game-answer" id="game-answer"></p>
          <button class="game-btn game-btn-next" type="button" id="game-next">next</button>
        </div>

        <p class="sr-only" role="status" aria-live="polite" id="game-status"></p>
      </section>

      <section class="game-result" id="game-result" hidden aria-label="Result">
        <h2 class="game-heading" id="game-result-score"></h2>
        <ol class="game-recap" id="game-recap"></ol>
        <div class="game-again">
          <button class="game-btn" type="button" id="game-replay">play again</button>
          <button class="game-btn" type="button" id="game-share" hidden>copy result</button>
          <button class="game-btn" type="button" id="game-change">menu</button>
        </div>
        <p class="game-share-note" id="game-share-note" hidden aria-live="polite"></p>
        <span class="game-leaders-slot" id="game-leaders-slot-result" hidden></span>
      </section>

      <!-- One board, moved between the menu and the result rather than built
           twice. -->
      <section class="game-leaders" id="game-leaders" hidden aria-label="Scoreboard">
        <div class="game-leaders-head">
          <h2 class="game-leaders-title">
            <button
              class="game-fold"
              type="button"
              id="game-leaders-fold"
              aria-expanded="true"
              aria-controls="game-leaders-body"
            >
              scoreboard
            </button>
          </h2>
          <div class="game-tabs" role="tablist" aria-label="Which board">
            <button class="game-tab is-on" type="button" role="tab" id="tab-today" aria-selected="true">
              today
            </button>
            <button class="game-tab" type="button" role="tab" id="tab-alltime" aria-selected="false">
              all time
            </button>
          </div>
        </div>
        <div class="game-leaders-body" id="game-leaders-body">
          <ol class="game-leaders-list" id="game-leaders-list"></ol>
          <p class="game-leaders-note" id="game-leaders-note" hidden aria-live="polite"></p>
        </div>
      </section>

      <div class="game-cosmetic" id="game-cosmetic" hidden>
        <button
          type="button"
          class="game-cosmetic-toggle"
          id="cosmetic-toggle"
          aria-expanded="false"
          aria-controls="game-colors"
        >
          cosmetic settings
        </button>

        <div class="game-colors" id="game-colors" hidden>
          <div class="game-color-row">
            <label for="color-bg">background</label>
            <input type="color" id="color-bg" value="#e68019" />
          </div>
          <div class="game-color-row">
            <label for="color-ink">text</label>
            <input type="color" id="color-ink" value="#ffffff" />
          </div>
          <div class="game-color-row">
            <label for="color-accent">accent</label>
            <input type="color" id="color-accent" value="#e3e3b0" />
          </div>

          <div class="game-presets">
            <h3 class="game-presets-title" id="game-presets-title">presets</h3>
            <div class="game-preset-list" id="game-preset-list"></div>
          </div>

          <button type="button" class="game-cosmetic-reset" id="reset-colors">
            reset to the default colours
          </button>

          <p class="game-color-warning" id="color-warning" hidden role="status"></p>
        </div>
      </div>

      <p class="game-credit" id="game-credit"></p>
      <p class="game-legal"><a href="/privacy/">privacy</a> &middot; <a href="/terms/">terms</a></p>
    </main>

    <noscript>
      <p class="game-lede">
        This one needs JavaScript. Everything else on the site works without it &mdash;
        <a href="/materials/">back to materials</a>.
      </p>
    </noscript>

    <script src="../to-top-btn.js" defer></script>
    <script src="../header.js" defer></script>
    <script src="supabase-config.js"></script>
    <script src="cloud.js" type="module"></script>
    <script src="game.js" defer></script>
  </body>
</html>
