<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports | CHRONIA</title>
    <meta name="description" content="The fact checkers' reports on CHRONIA, for review." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://chroniaatlas.com/reports/" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f1e7cf" />
    <link rel="preload" href="/fonts/im-fell-english-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="../page.css" />
    <link rel="stylesheet" href="reports.css" />
  </head>
  <body class="cp">
    <header class="cp-top"><a class="cp-mark cp-frame" href="../" aria-label="CHRONIA, back to the atlas">CHRONIA</a></header>
    <main class="cp-sheet cp-frame rp">
      <h1>Reports</h1>
      <p class="cp-lede">What the fact checkers have sent about errors on the map, newest first.</p>

      <form class="rp-lock" id="lock">
        <label for="pass">Review password</label>
        <input type="password" id="pass" autocomplete="current-password" required />
        <button type="submit" class="rp-btn" id="unlock">Open the reports</button>
        <p class="rp-note" id="lock-note" aria-live="polite"></p>
      </form>

      <section id="board" hidden>
        <div class="rp-bar" role="group" aria-label="Which reports to show">
          <button type="button" data-status="open" aria-pressed="true">Open</button> |
          <button type="button" data-status="fixed" aria-pressed="false">Fixed</button> |
          <button type="button" data-status="declined" aria-pressed="false">Declined</button> |
          <button type="button" data-status="all" aria-pressed="false">All</button>
          <span class="rp-count" id="count" aria-live="polite"></span>
          <button type="button" class="rp-out" id="out">Lock</button>
        </div>
        <ol class="rp-list" id="list"></ol>
      </section>
      <footer class="cp-foot"><a href="../">The atlas</a> | <a href="../team/">Team</a> | <a href="/privacy/">Privacy</a> | <a href="/terms/">Terms</a></footer>
    </main>

    <script src="reports.js" defer></script>
  </body>
</html>
