         on the first page they open there is nothing of the site to go back to. -->
    <script>
      (function () {
        try {
          var r = document.referrer && new URL(document.referrer);
          if (r && r.host === location.host && r.pathname !== location.pathname)
            document.documentElement.classList.add("has-back");
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="../styles.css" />
    <!-- Before the first paint: a remembered choice, otherwise the system's.
         The attribute is always written, so the stylesheet never has to guess
         and the page never flashes the other theme on the way in. The rest of
         the switch is in theme.js; this part cannot wait for a fetch. -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("ndl-theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
