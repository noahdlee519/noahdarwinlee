<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blog | Noah Darwin Lee</title>
    <meta
      name="description"
      content="Email newsletters from the summer of 2026 about travels in Japan, Korea, and Czechia."
    />
    <link rel="canonical" href="https://noahdarwinlee.com/blog/" />
    <link rel="icon" href="../favicon.png" type="image/png" />
    <link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noah Darwin Lee" />
    <meta property="og:title" content="Blog | Noah Darwin Lee" />
    <meta
      property="og:description"
      content="Email newsletters from the summer of 2026 about travels in Japan, Korea, and Czechia."
    />
    <meta property="og:url" content="https://noahdarwinlee.com/blog/" />
    <meta property="og:image" content="https://noahdarwinlee.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://noahdarwinlee.com/og.jpg" />

    <link rel="stylesheet" href="../styles.css" />
    <!-- Before the first paint: a remembered choice, otherwise the system's.
         The attribute is always written, so the stylesheet never has to guess
         and the page never flashes the other theme on the way in. The rest of
         the switch is in theme.js; this part cannot wait for a fetch. -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("ndl-theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body class="cv-page blog-page" data-fade-distance="90">
    <h1 class="sr-only">Blog</h1>
    <a class="name" href="/"
      ><span class="name-word-noah">Noah</span> <span class="name-word-darwin">Darwin</span>
      <span class="name-word-lee">Lee</span></a
    >
    <a class="back-link" href="/#about">back</a>
    <button class="to-top-btn" id="to-top-btn" aria-label="Back to top">
      <img src="../favicon.png" alt="" width="30" height="30" />
    </button>

    <main class="mail">
      <p class="mail-lede">
        A collection of email newsletters from the summer of 2026 about my adventures in
        Japan, Korea, and Czechia. Take a look!
      </p>

      <!-- When JavaScript is off the mail window is inert — no post list,
           no letter pane, nothing. Show the catalogue as a plain list so
           the page still has something to offer. -->
      <noscript>
        <div class="mail-noscript">
          <p>These letters need JavaScript to read (the mail client is interactive).</p>
          <ol class="mail-noscript-list">
            <li>Part 11 <span class="mail-noscript-date">16 Sep 2026</span></li>
            <li>Part 10 <span class="mail-noscript-date">6 Sep 2026</span></li>
            <li>Part 9 <span class="mail-noscript-date">27 Aug 2026</span></li>
            <li>Part 8 <span class="mail-noscript-date">3 Aug 2026</span></li>
            <li>Part 7 <span class="mail-noscript-date">28 Jul 2026</span></li>
            <li>Part 6 <span class="mail-noscript-date">22 Jul 2026</span></li>
            <li>Part 5 <span class="mail-noscript-date">15 Jul 2026</span></li>
            <li>Part 4 <span class="mail-noscript-date">11 Jul 2026</span></li>
            <li>Part 3 <span class="mail-noscript-date">7 Jul 2026</span></li>
            <li>Part 2 <span class="mail-noscript-date">4 Jul 2026</span></li>
            <li>Part 1 <span class="mail-noscript-date">2 Jul 2026</span></li>
          </ol>
        </div>
        <style>
          .mail-noscript {
            margin: 0 0 32px;
            font-weight: 300;
          }
          .mail-noscript p {
            font-size: clamp(16px, 1.8vw, 20px);
            margin: 0 0 14px;
          }
          .mail-noscript-list {
            list-style: decimal;
            padding-left: 2em;
            margin: 0;
            font-size: clamp(15px, 1.6vw, 18px);
            line-height: 1.8;
          }
          .mail-noscript-date {
            opacity: 0.65;
            margin-left: 0.4em;
          }
          .mail-noscript-date::before { content: "— "; }
        </style>
      </noscript>

      <!-- The window. Drawn the way the mail client these were read in draws
           itself — the backdrop, the pill of a search box, the rail, the white
           card — but with no wordmark and no logo: the arrangement is enough. -->
      <div class="mail-window">
        <div class="mail-bar">
          <span class="mail-menu" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </span>
          <form class="mail-search" role="search" onsubmit="return false">
            <label class="sr-only" for="mail-q">Search these letters</label>
            <span class="mail-search-field">
              <svg class="mail-search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="M15.5 15.5 20 20" />
              </svg>
              <input
                id="mail-q"
                class="mail-search-input"
                type="search"
                placeholder="Search mail"
                autocomplete="off"
                spellcheck="false"
              />
            </span>
          </form>
          <span class="mail-account" title="noahlee519@gmail.com">
            <span class="mail-avatar mail-avatar-me" aria-hidden="true">
              <svg viewBox="2.5 2 19 19">
                <circle cx="12" cy="8.5" r="4.4" />
                <path d="M2.5 22c0-4.6 4.2-7.2 9.5-7.2s9.5 2.6 9.5 7.2z" />
              </svg>
            </span>
          </span>
        </div>

        <div class="mail-body">
          <nav class="mail-rail" aria-label="Folders and labels">
            <!-- The one thing a visitor can compose here is a mail to me. -->
            <a class="mail-compose" href="mailto:noahlee519@gmail.com">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" />
                <path d="M13.5 8.5l2 2" />
              </svg>
              Compose
            </a>
            <ul class="mail-folders" id="mail-folders"></ul>
          </nav>
          <!-- Drag to give the folders more or less room; double-click to put
               it back. -->
          <div
            class="mail-divider"
            id="mail-divider-rail"
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize the folders"
            tabindex="0"
          ></div>

          <div class="mail-panes" id="mail-panes">
            <section class="mail-listpane" aria-label="Letters">
              <div class="mail-listhead">
                <span class="mail-count" id="mail-count"></span>
              </div>
              <ol class="mail-list" id="mail-list" tabindex="-1"></ol>
              <p class="mail-empty" id="mail-empty" hidden></p>
            </section>

            <div
              class="mail-divider"
              id="mail-divider-list"
              role="separator"
              aria-orientation="vertical"
              aria-label="Resize the list"
              tabindex="0"
            ></div>

            <article class="mail-read" id="mail-read" aria-live="polite">
              <div class="mail-read-blank" id="mail-read-blank">
                <p>Pick an entry to read</p>
                <p class="mail-keys"><kbd>esc</kbd> to come back</p>
              </div>
            </article>
          </div>
        </div>
      </div>
    </main>

    <script src="posts.js"></script>
    <script src="blog.js" defer></script>
    <script src="../to-top-btn.js" defer></script>
    <script src="../header.js" defer></script>
      <script src="../theme.js" defer></script>
  </body>
</html>
