<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found | Noah Darwin Lee</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <!-- Before the first paint: a remembered choice, otherwise the system's.
         The attribute is always written, so the stylesheet never has to guess
         and the page never flashes the other theme on the way in. The rest of
         the switch is in theme.js; this part cannot wait for a fetch. -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("ndl-theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <style>
      .notfound {
        max-width: 46ch;
        margin-top: 8px;
      }
      .notfound h1 {
        font-size: 22px;
        font-weight: 300;
        margin: 0 0 14px;
      }
      .notfound p {
        font-size: 20px;
        font-weight: 300;
        margin: 0 0 22px;
      }
      .notfound ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 22px;
      }
      .notfound a {
        color: inherit;
        text-decoration: none;
        width: fit-content;
      }
      .notfound a:hover {
        text-decoration: underline;
        text-decoration-thickness: 2.25px;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body class="cv-page" data-fade-distance="90">
    <a class="name" href="/"
      ><span class="name-word-noah">Noah</span> <span class="name-word-darwin">Darwin</span>
      <span class="name-word-lee">Lee</span></a
    >
    <main class="notfound">
      <h1>That page isn't here.</h1>
      <p>It may have moved, or the link may have a typo in it.</p>
      <ul>
        <li><a href="/">the art</a></li>
        <li><a href="/#about">about</a></li>
        <li><a href="/cv/">cv</a></li>
        <li><a href="/materials/">materials</a></li>
      </ul>
    </main>
      <script src="/theme.js" defer></script>
  </body>
</html>
