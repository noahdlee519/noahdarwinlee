<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found | Noah Darwin Lee</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("ndl-theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <style>
      .notfound {
        margin-top: 8px;
      }

      .notfound h1 {
        margin: 0 0 6px;
        font-size: clamp(120px, 24vw, 280px);
        line-height: 0.82;
        font-weight: 600;
        letter-spacing: -0.045em;
      }

      .notfound h1 a {
        color: inherit;
        text-decoration: none;
      }

      .anagram {
        position: relative;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        margin-top: clamp(64px, 12vh, 120px);
        width: fit-content;
        max-width: 100%;
      }

      .ana-row {
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        font-size: clamp(20px, 4.4vw, 42px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
        text-align: left;
      }

      .ana-row .ch {
        display: inline-block;
        width: 1.12em;
        text-align: center;
      }

      .ana-row .sp {
        display: inline-block;
        width: 0.56em;
      }

      .ana-name {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .ana-name:active {
        transform: scale(0.985);
      }

      .ana-gap {
        height: clamp(90px, 16vh, 150px);
      }

      .ana-phrase .pn {
        display: inline-block;
        width: 0.4em;
      }

      .ana-lines {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .ana-lines line {
        stroke: var(--accent);
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      .cv-page main p.ana-phrase {
        margin: 0;
      }

      .cv-page main p.ana-hint {
        margin: 26px 0 0;
      }

      .ana-hint {
        font-size: 15px;
        font-weight: 300;
        opacity: 0.75;
      }

    </style>
  </head>
  <body class="cv-page" data-fade-distance="90">
    <a class="name" href="/"
      ><span class="name-word-noah">Noah</span> <span class="name-word-darwin">Darwin</span>
      <span class="name-word-lee">Lee</span></a
    >
    <main class="notfound">
      <h1><a href="/" aria-label="404. Back to the home page">404</a></h1>

      <div class="anagram" id="anagram">
        <button class="ana-row ana-name" id="ana-name" type="button" aria-label="Noah Darwin Lee. Show another anagram"></button>
        <div class="ana-gap" aria-hidden="true"></div>
        <p class="ana-row ana-phrase" id="ana-phrase" aria-live="polite"></p>
        <svg class="ana-lines" id="ana-lines" aria-hidden="true"></svg>
      </div>
      <p class="ana-hint">Click for another.</p>
    </main>
    <script>
      (function () {
        var NAME = "NOAH DARWIN LEE";
        var PHRASES = [
          "LEAN WIDER, NOAH",
          "A LAD IN NOWHERE",
          "I RELOAD IN AWE",
          "NO AI DRAWL HERE!",
          "I LAND... NOWHERE",
          "RELOAD? NAH. WINE.",
          "OR, HEAL A LINE",
          "ALONE, I WANDER",
          "A REAL, NOW HIDDEN",
          "HE REDO AND WAIL",
          "AW. I ELIDE NOAH",
          "WHO READ A LINE?",
          "HEED A WIN OR NO"
        ];
        var nameEl = document.getElementById("ana-name");
        var phraseEl = document.getElementById("ana-phrase");
        var svg = document.getElementById("ana-lines");
        var box = document.getElementById("anagram");
        var at = 0;

        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function spell(el, text) {
          el.innerHTML = text
            .split("")
            .map(function (c) {
              if (c === " ") return '<span class="sp"></span>';
              if (!/[A-Z]/.test(c)) return '<span class="pn">' + c + "</span>";
              return '<span class="ch" data-c="' + c + '">' + c + "</span>";
            })
            .join("");
        }

        var STEP = 45;
        var FALL = 420;
        var EASE = "cubic-bezier(0.6, 0, 0.3, 1)";

        function draw(animate) {
          var top = Array.prototype.slice.call(nameEl.querySelectorAll(".ch"));
          var bottom = Array.prototype.slice.call(phraseEl.querySelectorAll(".ch"));
          var used = [];
          var pairs = [];
          top.forEach(function (t) {
            var c = t.getAttribute("data-c");
            for (var j = 0; j < bottom.length; j++) {
              if (!used[j] && bottom[j].getAttribute("data-c") === c) {
                used[j] = true;
                pairs.push([t, bottom[j]]);
                return;
              }
            }
          });

          svg.innerHTML = "";
          var NS = "http://www.w3.org/2000/svg";
          var moving = animate && !reduce;
          pairs.forEach(function (pr, k) {
            var a = pr[0], z = pr[1];
            var x1 = a.offsetLeft + a.offsetWidth / 2, y1 = a.offsetTop + a.offsetHeight + 6;
            var x2 = z.offsetLeft + z.offsetWidth / 2, y2 = z.offsetTop - 6;
            var len = Math.hypot(x2 - x1, y2 - y1);
            var line = document.createElementNS(NS, "line");
            line.setAttribute("x1", x1.toFixed(1));
            line.setAttribute("y1", y1.toFixed(1));
            line.setAttribute("x2", x2.toFixed(1));
            line.setAttribute("y2", y2.toFixed(1));
            line.style.strokeDasharray = len.toFixed(1);
            svg.appendChild(line);
            if (!moving) return;

            var timing = { duration: FALL, delay: k * STEP, easing: EASE, fill: "backwards" };
            var dx = a.offsetLeft - z.offsetLeft, dy = a.offsetTop - z.offsetTop;
            z.animate(
              [{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "translate(0px, 0px)" }],
              timing
            );
            line.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], timing);
          });

          if (moving) {
            var after = Math.max(0, pairs.length * STEP + FALL - 160);
            Array.prototype.forEach.call(phraseEl.querySelectorAll(".ch, .pn"), function (el) {
              var j = bottom.indexOf(el);
              if (j >= 0 && used[j]) return;
              el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: after, easing: "ease-out", fill: "backwards" });
            });
          }
        }

        function show(animate) {
          spell(phraseEl, PHRASES[at]);
          draw(animate);
        }

        spell(nameEl, NAME);
        var started = false;
        var start = function () {
          if (started) return;
          started = true;
          show(true);
        };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
        setTimeout(start, 700);
        box.addEventListener("click", function () {
          at = (at + 1) % PHRASES.length;
          show(true);
        });

        var settle = function () {
          draw(false);
        };
        var t;
        window.addEventListener("resize", function () {
          clearTimeout(t);
          t = setTimeout(settle, 80);
        });
      })();
    </script>
    <script src="/theme.js" defer></script>
  </body>
</html>
