<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#ffffff" />
    <title>Noah Darwin Lee | Projects</title>
    <meta name="description" content="A map of an imaginary world in which every country is one of Noah Darwin Lee’s projects." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preload" href="/fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <script src="/portfolio-map/map.js" defer></script>
    <script src="/portfolio-map/app.js" defer></script>
