    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("ndl-theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <script src="/visit.js" defer></script>

  <body class="drill-page">
    <a class="name" href="/"
      ><span class="name-word-noah">Noah</span> <span class="name-word-darwin">Darwin</span>
      <span class="name-word-lee">Lee</span></a
    >
    <a class="back-link" href="/projects/">back</a>

    <h1 class="page-title">Drill</h1>

    <main class="drill">
      <p class="lede">Quizzes, flip cards, matching, and timelines for the people a well-read person is expected to know. Progress is saved in this browser.</p>
      <ul class="hub-list">
        <li>
          <a class="hub-link" href="/drill/philosophers/">Philosophers</a>
          <p class="hub-desc">their ideas, works, schools, and lives<span class="d-small" data-progress="philosophers"></span></p>
        </li>
        <li>
          <a class="hub-link" href="/drill/authors/">Authors</a>
          <p class="hub-desc">their works, first lines, characters, and lives<span class="d-small" data-progress="authors"></span></p>
        </li>
      </ul>
    </main>

    <script>
      (function () {
        document.querySelectorAll("[data-progress]").forEach(function (el) {
          var stats = null;
          try {
            stats = JSON.parse(localStorage.getItem("ndl-drill-" + el.getAttribute("data-progress") + "-stats"));
          } catch (e) {}
          if (!stats) return;
          var seen = 0;
          var known = 0;
          Object.keys(stats).forEach(function (id) {
            seen++;
            if (stats[id][0] >= 4) known++;
          });
          if (seen) el.textContent = "seen " + seen + " · known " + known;
        });
      })();
    </script>
    <script src="/header.js" defer></script>
    <script src="/theme.js" defer></script>
  </body>
